<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Safari Sticker</title>
    <link rel="stylesheet" href="/sticker.css" />
  </head>
  <body>
    <div class="sticker-shell">
      <header class="sticker-titlebar">
        <div class="title-copy">
          <span id="source-pill" class="source-pill">All</span>
          <strong>Agent Safari</strong>
        </div>
        <div class="title-tools">
          <div class="language-menu">
            <button id="language-menu-button" class="language-menu-button" type="button" title="Pokemon name language" aria-label="Pokemon name language" aria-haspopup="true" aria-expanded="false">KO</button>
            <div id="language-options" class="language-options" role="menu" aria-label="Pokemon name language">
              <button type="button" role="menuitemradio" data-language-option="en" aria-checked="false">EN</button>
              <button type="button" role="menuitemradio" data-language-option="ko" aria-checked="true">KO</button>
            </div>
          </div>
          <div class="window-actions">
            <button id="expand-btn" type="button" title="Open dashboard" aria-label="Open dashboard">+</button>
            <button id="minimize-btn" type="button" title="Minimize" aria-label="Minimize">_</button>
            <button id="quit-btn" type="button" title="Quit" aria-label="Quit">x</button>
          </div>
        </div>
      </header>

      <main class="sticker-main">
        <section class="limits-panel" aria-label="Usage budgets">
          <div id="rate-limit-list" class="rate-limit-list"></div>
        </section>

        <section class="owned-panel" aria-label="Party Pokemon">
          <div class="section-head">
            <span class="section-label">PARTY</span>
            <strong id="owned-count">0</strong>
          </div>
          <div id="owned-list" class="owned-row-list"></div>
        </section>

        <section class="agents-panel" aria-label="Agents">
          <div class="section-head">
            <span class="section-label">Agents</span>
            <strong id="agent-count">0</strong>
          </div>
          <div id="agent-list" class="agent-row-list"></div>
        </section>

        <section class="status-grid" aria-label="Agent status counts">
          <div><span id="active-count">0</span><small>active</small></div>
          <div><span id="thinking-count">0</span><small>thinking</small></div>
          <div><span id="tool-count">0</span><small>tool</small></div>
          <div><span id="waiting-count">0</span><small>waiting</small></div>
          <div><span id="sleeping-count">0</span><small>sleeping</small></div>
        </section>

        <footer class="sticker-footer">
          <span id="connection-state" class="connection-state">connecting</span>
          <span id="last-update">--</span>
        </footer>
      </main>
    </div>

    <script src="/sticker.js"></script>
  </body>
</html>
